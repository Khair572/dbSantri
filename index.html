<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Santri Pulang/Kabur</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-6 max-w-7xl">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Daftar Data Santri Pulang / Kabur</h1>
                <a href="admin.html" class="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700 transition">+ Input Data Baru</a>
            </div>

            <!-- Tabel Data -->
            <div class="overflow-x-auto">
                <table class="w-full border-collapse border border-gray-200 text-left text-sm">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 uppercase text-xs">
                            <th class="border border-gray-300 p-3">No</th>
                            <th class="border border-gray-300 p-3">Nama</th>
                            <th class="border border-gray-300 p-3">Alamat</th>
                            <th class="border border-gray-300 p-3">Denda (Rp)</th>
                            <th class="border border-gray-300 p-3">Pulang</th>
                            <th class="border border-gray-300 p-3">Izin</th>
                            <th class="border border-gray-300 p-3">Balik</th>
                            <th class="border border-gray-300 p-3">Kabur/Izin</th>
                            <th class="border border-gray-300 p-3">Ket</th>
                            <th class="border border-gray-300 p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="santriTableBody" class="text-gray-700">
                        <!-- Data dimuat lewat script -->
                    </tbody>
                </table>
            </div>
            <div id="emptyMessage" class="text-center py-6 text-gray-500 hidden">Belum ada data santri yang tersimpan.</div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        // Supabase Config (Sudah diisi otomatis)
        const SUPABASE_URL = 'https://jrwesltacmbvhpkygfca.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_spoWuAXY2joni9IM1gSfAA_WJs0QS5A';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadData() {
            const tbody = document.getElementById('santriTableBody');
            const emptyMessage = document.getElementById('emptyMessage');
            
            tbody.innerHTML = '<tr><td colspan="10" class="text-center p-4">Memuat data...</td></tr>';

            const { data: santriList, error } = await _supabase
                .from('santri')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                alert('Gagal memuat data: ' + error.message);
                return;
            }

            tbody.innerHTML = '';

            if (!santriList || santriList.length === 0) {
                emptyMessage.classList.remove('hidden');
                return;
            } else {
                emptyMessage.classList.add('hidden');
            }

            santriList.forEach((santri, index) => {
                const formattedDenda = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(santri.denda);
                const badgeColor = santri.kabur_izin === 'Kabur' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <th class="border border-gray-300 p-3 text-center">${index + 1}</th>
                    <td class="border border-gray-300 p-3 font-medium">${santri.nama}</td>
                    <td class="border border-gray-300 p-3">${santri.alamat}</td>
                    <td class="border border-gray-300 p-3">${formattedDenda}</td>
                    <td class="border border-gray-300 p-3">${santri.pulang}</td>
                    <td class="border border-gray-300 p-3">${santri.izin}</td>
                    <td class="border border-gray-300 p-3">${santri.balik}</td>
                    <td class="border border-gray-300 p-3"><span class="px-2 py-1 rounded text-xs font-semibold ${badgeColor}">${santri.kabur_izin}</span></td>
                    <td class="border border-gray-300 p-3">${santri.ket}</td>
                    <td class="border border-gray-300 p-3 text-center">
                        <button onclick="deleteData(${santri.id})" class="bg-red-500 text-white px-2.5 py-1 rounded text-xs hover:bg-red-600 transition">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteData(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data ini?')) {
                const { error } = await _supabase.from('santri').delete().eq('id', id);
                if (error) {
                    alert('Gagal menghapus data: ' + error.message);
                } else {
                    loadData();
                }
            }
        }

        // Realtime Listener
        _supabase
            .channel('public:santri')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'santri' }, payload => {
                loadData();
                if (Notification.permission === "granted") {
                    navigator.serviceWorker.ready.then(function(registration) {
                        registration.showNotification("Ada Data Santri Masuk!", {
                            body: `${payload.new.nama} (${payload.new.kabur_izin})`,
                            icon: "icon.png"
                        });
                    });
                }
            })
            .subscribe();

        window.onload = loadData;
    </script>
</body>
</html>
