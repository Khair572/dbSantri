<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Data Santri</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: system-ui, -apple-system, sans-serif; }</style>
    <script>
    /* Tema siang/malam (dibagikan antar halaman lewat localStorage 'theme') */
    (function () {
        var t; try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.addEventListener('DOMContentLoaded', function () {
            var m = document.querySelector('meta[name="theme-color"]'), light = m ? m.content : '#4f46e5';
            function sync() { if (m) m.content = document.documentElement.classList.contains('dark') ? '#1e1e1e' : light; }
            sync();
            document.addEventListener('click', function (e) {
                if (!e.target.closest('#themeToggle')) return;
                var d = document.documentElement.classList.toggle('dark');
                try { localStorage.setItem('theme', d ? 'dark' : 'light'); } catch (x) {}
                sync();
            });
        });
    })();
    </script>
    <style>
        .theme-toggle { width: 40px; height: 40px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: #f1f5f9; color: #475569; transition: background .2s; }
        .theme-toggle:hover { background: #e2e8f0; }
        .theme-toggle .i-sun { display: none; } .dark .theme-toggle .i-sun { display: block; } .dark .theme-toggle .i-moon { display: none; }
        .dark { color-scheme: dark; }
        .dark body { background: #121212; color: #f5f5f5; }
        .dark .bg-white { background-color: #1e1e1e; }
        .dark .bg-slate-50, .dark .bg-gray-100 { background-color: #2a2a2a; }
        .dark body.bg-gray-100 { background-color: #121212; }
        .dark .bg-slate-100 { background-color: #2a2a2a; }
        .dark .focus\:bg-white:focus { background-color: #1e1e1e; }
        .dark .hover\:bg-slate-100:hover, .dark .hover\:bg-slate-200:hover { background-color: #383838; }
        .dark .hover\:bg-slate-50\/80:hover { background-color: rgba(42,42,42,.6); }
        .dark .theme-toggle { background: #2a2a2a; color: #fbbf24; } .dark .theme-toggle:hover { background: #383838; }
        .dark .text-slate-800, .dark .text-gray-800 { color: #f5f5f5; }
        .dark .text-slate-700, .dark .text-gray-700 { color: #d4d4d4; }
        .dark .text-slate-600, .dark .text-slate-500, .dark .text-gray-500 { color: #a3a3a3; }
        .dark .text-slate-400, .dark .text-gray-400 { color: #8a8a8a; }
        .dark .text-slate-300 { color: #6b6b6b; }
        .dark .hover\:text-slate-600:hover { color: #f5f5f5; }
        .dark .border-slate-100, .dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: #2a2a2a; }
        .dark .border-slate-200, .dark .border-slate-200\/70, .dark .border-gray-300 { border-color: #3a3a3a; }
        .dark .ring-slate-900\/5 { --tw-ring-color: rgba(255,255,255,.08); }
        .dark .scrollbar-thin::-webkit-scrollbar-thumb { background: #5a5a5a; }
        .dark .bg-indigo-50 { background-color: rgba(99,102,241,.18); } .dark .text-indigo-600 { color: #a5b4fc; } .dark .hover\:bg-indigo-100:hover { background-color: rgba(99,102,241,.3); }
        .dark .bg-rose-50, .dark .bg-rose-100 { background-color: rgba(244,63,94,.18); } .dark .text-rose-600, .dark .text-rose-700, .dark .text-red-600 { color: #fda4af; } .dark .hover\:bg-rose-100:hover { background-color: rgba(244,63,94,.3); }
        .dark .bg-emerald-50, .dark .bg-emerald-100 { background-color: rgba(16,185,129,.18); } .dark .text-emerald-700 { color: #6ee7b7; } .dark .text-emerald-600 { color: #34d399; } .dark .hover\:bg-emerald-100:hover { background-color: rgba(16,185,129,.3); }
        .dark .bg-amber-100 { background-color: rgba(245,158,11,.18); } .dark .text-amber-700 { color: #fcd34d; } .dark .text-amber-600 { color: #fbbf24; }
        .dark .bg-sky-100 { background-color: rgba(14,165,233,.18); } .dark .text-sky-700 { color: #7dd3fc; } .dark .text-sky-600 { color: #38bdf8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div class="fixed top-4 right-4"><button type="button" id="themeToggle" class="theme-toggle" aria-label="Ganti mode siang atau malam" title="Mode siang / malam">
                    <svg class="i-moon w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                    <svg class="i-sun w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button></div>

    <main class="min-h-screen flex items-center justify-center p-5">
        <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-900/5 p-6 sm:p-8 w-full max-w-sm">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 shadow-sm flex items-center justify-center mb-5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <h1 class="text-xl font-extrabold text-slate-800 leading-tight">Login Admin</h1>
            <p class="text-sm text-slate-500 mt-1 mb-6">Masuk untuk mengelola data santri.</p>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-slate-700 font-semibold mb-1.5 text-sm">Email</label>
                    <input type="email" id="email" required autocomplete="username" class="w-full border border-slate-200 bg-slate-50 rounded-xl px-3.5 py-2.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="admin@contoh.com">
                </div>
                <div>
                    <label for="password" class="block text-slate-700 font-semibold mb-1.5 text-sm">Kata sandi</label>
                    <div class="relative">
                        <input type="password" id="password" required autocomplete="current-password" class="w-full border border-slate-200 bg-slate-50 rounded-xl px-3.5 py-2.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition pr-11" placeholder="••••••••">
                        <button type="button" id="showPass" aria-label="Tampilkan kata sandi" class="absolute right-1.5 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 transition">
                            <svg class="eye-on w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off hidden w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/></svg>
                        </button>
                    </div>
                </div>
                <p id="errorMsg" role="alert" class="text-sm text-rose-600 bg-rose-50 rounded-xl px-3.5 py-2.5 hidden"></p>
                <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold py-2.5 rounded-xl shadow-sm hover:shadow-md hover:from-indigo-500 hover:to-violet-500 active:scale-[0.99] disabled:opacity-60 transition-all">Masuk</button>
            </form>

            <p class="text-center text-sm mt-6">
                <a href="../index.html" class="text-slate-500 hover:text-indigo-600 font-medium transition">Kembali ke halaman data</a>
            </p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://jrwesltacmbvhpkygfca.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_spoWuAXY2joni9IM1gSfAA_WJs0QS5A';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Jika sudah login, langsung lempar ke admin.html
        _supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'admin.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.textContent = 'Login gagal: ' + error.message;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Masuk';
            } else {
                window.location.href = 'admin.html';
            }
        });
    
        document.getElementById('showPass').addEventListener('click', function () {
            const p = document.getElementById('password');
            const show = p.type === 'password';
            p.type = show ? 'text' : 'password';
            this.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
            this.querySelector('.eye-on').classList.toggle('hidden', show);
            this.querySelector('.eye-off').classList.toggle('hidden', !show);
        });
    </script>
</body>
</html>
